<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiverse Plugson - Configuration Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <div class="min-h-screen flex flex-col">
        <header class="bg-blue-600 text-white shadow">
            <div class="max-w-7xl mx-auto px-4 py-6 flex justify-between items-center">
                <h1 class="text-2xl font-bold">Multiverse Plugson</h1>
                <span class="text-sm bg-blue-700 px-3 py-1 rounded-full">v1.0.0</span>
            </div>
        </header>
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
            <div class="bg-white rounded-xl shadow p-6 mb-8">
                <h2 class="text-xl font-semibold mb-4 text-slate-800">Plugin & Theme Configuration (ventoy.json)</h2>
                <form id="configForm" class="space-y-4">
                    <div>
                        <label for="themeName" class="block text-sm font-medium text-slate-700 mb-1">Theme Name</label>
                        <input type="text" id="themeName" value="ventoy-adwaita" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label for="timeout" class="block text-sm font-medium text-slate-700 mb-1">Timeout (seconds)</label>
                        <input type="number" id="timeout" value="10" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div class="flex items-center">
                        <input type="checkbox" id="persistence" checked class="h-4 w-4 text-blue-600 border-slate-300 rounded">
                        <label for="persistence" class="ml-2 text-sm text-slate-700">Enable Persistence</label>
                    </div>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">Save Configuration</button>
                </form>
            </div>
        </main>
    </div>
    <script>
        document.getElementById('configForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            alert('Configuration saved successfully!');
        });
    </script>
</body>
</html>
